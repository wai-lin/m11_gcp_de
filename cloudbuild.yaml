substitutions:
  _REGION: asia-southeast1
  _DATASET: tiktok_scraper
  _RAW_BUCKET: $PROJECT_ID-tiktok-raw
  _MANIFEST_BUCKET: $PROJECT_ID-tiktok-manifest
  _READY_BUCKET: $PROJECT_ID-tiktok-ready
  _EXTRACT_FUNCTION: scrape-tiktok-extract
  _STAGE_FUNCTION: scrape-tiktok-stage
  _PROD_FUNCTION: scrape-tiktok-prod
  _SCHED_SA: hs2026de@hs2026de.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Step 1/5: create buckets used by extract -> stage -> prod.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        for bucket in "${_RAW_BUCKET}" "${_MANIFEST_BUCKET}" "${_READY_BUCKET}"; do
          if gsutil ls -b "gs://$$bucket" >/dev/null 2>&1; then
            echo "Bucket gs://$$bucket already exists"
          else
            gsutil mb -l "${_REGION}" "gs://$$bucket"
            echo "Created bucket gs://$$bucket"
          fi
        done

  # Step 2/5: deploy extraction function. Scheduler hits this HTTP endpoint.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "functions",
        "deploy",
        "${_EXTRACT_FUNCTION}",
        "--gen2",
        "--runtime=python313",
        "--region=${_REGION}",
        "--source=.",
        "--entry-point=extract_request",
        "--trigger-http",
        "--allow-unauthenticated",
        "--set-env-vars=BQ_PROJECT=$PROJECT_ID,BQ_DATASET=${_DATASET},RAW_BUCKET=${_RAW_BUCKET},MANIFEST_BUCKET=${_MANIFEST_BUCKET},RAW_PREFIX=raw",
        "--quiet",
      ]

  # Step 3/5: stage only on finalized manifest objects.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "functions",
        "deploy",
        "${_STAGE_FUNCTION}",
        "--gen2",
        "--runtime=python313",
        "--region=${_REGION}",
        "--source=.",
        "--entry-point=stage_manifest_event",
        "--trigger-event-filters=type=google.cloud.storage.object.v1.finalized",
        "--trigger-event-filters=bucket=${_MANIFEST_BUCKET}",
        "--set-env-vars=BQ_PROJECT=$PROJECT_ID,BQ_DATASET=${_DATASET},STAGING_MARKER_BUCKET=${_READY_BUCKET}",
        "--quiet",
      ]

  # Step 4/5: run prod transforms only after staging emits ready marker.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "functions",
        "deploy",
        "${_PROD_FUNCTION}",
        "--gen2",
        "--runtime=python313",
        "--region=${_REGION}",
        "--source=.",
        "--entry-point=prod_marker_event",
        "--trigger-event-filters=type=google.cloud.storage.object.v1.finalized",
        "--trigger-event-filters=bucket=${_READY_BUCKET}",
        "--set-env-vars=BQ_PROJECT=$PROJECT_ID,BQ_DATASET=${_DATASET}",
        "--quiet",
      ]

  # Step 5/5: schedule the extract function, not staging or prod directly.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        EXTRACT_URL=$(gcloud functions describe "${_EXTRACT_FUNCTION}" --gen2 --region="${_REGION}" --format='value(serviceConfig.uri)')
        CRON_NAME="${_EXTRACT_FUNCTION}-cron"
        if gcloud scheduler jobs create http "$${CRON_NAME}" \
          --schedule="0 0 * * *" \
          --time-zone="Asia/Bangkok" \
          --max-retry-attempts=0 \
          --uri="$$EXTRACT_URL" \
          --location="${_REGION}" \
          --http-method=POST \
          --oauth-service-account-email="${_SCHED_SA}" \
          --message-body='{}'; then
          echo "Created scheduler job $$CRON_NAME"
        else
          gcloud scheduler jobs update http "$${CRON_NAME}" \
            --schedule="0 0 * * *" \
            --time-zone="Asia/Bangkok" \
            --max-retry-attempts=0 \
            --uri="$$EXTRACT_URL" \
            --location="${_REGION}" \
            --http-method=POST \
            --oauth-service-account-email="${_SCHED_SA}" \
            --message-body='{}'
        fi
