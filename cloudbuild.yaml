substitutions:
  _REGION: asia-southeast1
  _EXTRACT_FUNCTION: scrape-tiktok-extract
  _STAGE_FUNCTION: scrape-tiktok-stage
  _PROD_FUNCTION: scrape-tiktok-prod
  _SCHED_SA: hs2026de@hs2026de.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        RAW_BUCKET="${PROJECT_ID}-tiktok-raw"
        MANIFEST_BUCKET="${PROJECT_ID}-tiktok-manifest"
        READY_BUCKET="${PROJECT_ID}-tiktok-ready"

        for bucket in "$$RAW_BUCKET" "$$MANIFEST_BUCKET" "$$READY_BUCKET"; do
          if gsutil ls -b "gs://$$bucket" >/dev/null 2>&1; then
            echo "Bucket gs://$$bucket already exists"
          else
            gsutil mb -l "${_REGION}" "gs://$$bucket"
            echo "Created bucket gs://$$bucket"
          fi
        done

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "functions",
        "deploy",
        "${_EXTRACT_FUNCTION}",
        "--gen2",
        "--runtime=python313",
        "--region=${_REGION}",
        "--source=.",
        "--entry-point=extract_request",
        "--trigger-http",
        "--allow-unauthenticated",
        "--set-env-vars=BQ_PROJECT=$PROJECT_ID,BQ_DATASET=tiktok_scraper,RAW_BUCKET=$PROJECT_ID-tiktok-raw,MANIFEST_BUCKET=$PROJECT_ID-tiktok-manifest,RAW_PREFIX=raw",
        "--quiet",
      ]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "functions",
        "deploy",
        "${_STAGE_FUNCTION}",
        "--gen2",
        "--runtime=python313",
        "--region=${_REGION}",
        "--source=.",
        "--entry-point=stage_manifest_event",
        "--trigger-event-filters=type=google.cloud.storage.object.v1.finalized",
        "--trigger-event-filters=bucket=$PROJECT_ID-tiktok-manifest",
        "--set-env-vars=BQ_PROJECT=$PROJECT_ID,BQ_DATASET=tiktok_scraper,STAGING_MARKER_BUCKET=$PROJECT_ID-tiktok-ready",
        "--quiet",
      ]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "functions",
        "deploy",
        "${_PROD_FUNCTION}",
        "--gen2",
        "--runtime=python313",
        "--region=${_REGION}",
        "--source=.",
        "--entry-point=prod_marker_event",
        "--trigger-event-filters=type=google.cloud.storage.object.v1.finalized",
        "--trigger-event-filters=bucket=$PROJECT_ID-tiktok-ready",
        "--set-env-vars=BQ_PROJECT=$PROJECT_ID,BQ_DATASET=tiktok_scraper",
        "--quiet",
      ]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        EXTRACT_URL=$(gcloud functions describe "${_EXTRACT_FUNCTION}" --gen2 --region="${_REGION}" --format='value(serviceConfig.uri)')
        CRON_NAME="${_EXTRACT_FUNCTION}-cron"
        if gcloud scheduler jobs create http "$${CRON_NAME}" \
          --schedule="0 0 * * *" \
          --time-zone="Asia/Bangkok" \
          --max-retry-attempts=0 \
          --uri="$$EXTRACT_URL" \
          --location="${_REGION}" \
          --http-method=POST \
          --oauth-service-account-email="${_SCHED_SA}" \
          --message-body='{}'; then
          echo "Created scheduler job $$CRON_NAME"
        else
          gcloud scheduler jobs update http "$${CRON_NAME}" \
            --schedule="0 0 * * *" \
            --time-zone="Asia/Bangkok" \
            --max-retry-attempts=0 \
            --uri="$$EXTRACT_URL" \
            --location="${_REGION}" \
            --http-method=POST \
            --oauth-service-account-email="${_SCHED_SA}" \
            --message-body='{}'
        fi
