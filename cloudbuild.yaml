substitutions:
  _REGION: asia-southeast1
  _AR_REPO: tiktok-jobs
  _IMAGE: tiktok-scraper
  _JOB_NAME: scrape-tiktok
  _SCHED_SA: hs2026de@hs2026de.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:${SHORT_SHA}",
        "--build-arg",
        "UV_PYTHON_DOWNLOADS=never",
        ".",
      ]

  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:${SHORT_SHA}",
      ]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "run",
        "jobs",
        "update",
        "${_JOB_NAME}",
        "--image",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:${SHORT_SHA}",
        "--region",
        "${_REGION}",
        "--quiet",
      ]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "run",
        "jobs",
        "execute",
        "${_JOB_NAME}",
        "--region",
        "${_REGION}",
        "--quiet",
      ]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        CRON_NAME="${_JOB_NAME}-cron"
        URI="https://run.googleapis.com/v1/projects/$PROJECT_ID/locations/${_REGION}/jobs/${_JOB_NAME}:run"
        gcloud scheduler jobs create http "$${CRON_NAME}" \
          --schedule="0 0 * * *" \
          --time-zone="UTC" \
          --uri="$${URI}" \
          --location="${_REGION}" \
          --http-method=POST \
          --oauth-service-account-email="${_SCHED_SA}" \
          --message-body='{}' || \
        gcloud scheduler jobs update http "$${CRON_NAME}" \
          --schedule="0 0 * * *" \
          --time-zone="UTC" \
          --uri="$${URI}" \
          --location="${_REGION}" \
          --http-method=POST \
          --oauth-service-account-email="${_SCHED_SA}" \
          --message-body='{}'
